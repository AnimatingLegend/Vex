# Add Documentation tag to PR's changing markdown files, or anything in the docs folder
'pr: documentation':
- changed-files:
  - any-glob-to-any-file:
      - docs/*
      - '**/*.md'

# Add programming tag to PR's changing code related files
'pr: programming':
- changed-files:
  - any-glob-to-any-file:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.ts'

# Add GitHub tag to PR's changing yml files, or anything in the .github folder 
'pr: github':
- changed-files:
  - any-glob-to-any-file:
      - github/*
      - '**/*.yml'